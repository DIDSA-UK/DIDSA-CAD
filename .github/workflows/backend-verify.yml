name: Backend - build and test

on:
  push:
    branches:
      - "**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-verify.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  build-and-test:
    # Each matrix leg now runs on a *native* runner for its own platform -
    # no QEMU. The backend pulls in pythonocc-core (OCCT, a large native
    # C++ geometry kernel) and py-slvs (a native constraint solver); running
    # that under QEMU's user-mode binary translation on the arm64 leg was
    # not just slow but prone to genuinely stalling for 40+ minutes on a
    # step the native amd64 leg finished in ~2 - a known bad combination for
    # emulating heavy native/floating-point code, not something tunable
    # away with more parallelism or caching. GitHub's arm64-hosted runners
    # (ubuntu-24.04-arm) are free for public repos and remove the emulation
    # layer entirely, so this leg now builds and runs on real arm64
    # hardware, same as the amd64 leg already did on real amd64 hardware.
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: ${{ matrix.platform }}
          tags: didsa-cad-backend:test
          load: true

      - name: Run backend tests inside container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            didsa-cad-backend:test \
            python -m pytest tests/ -v -n auto

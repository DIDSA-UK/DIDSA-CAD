name: Backend - build and test

on:
  push:
    branches:
      - "**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-verify.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  build-and-test:
    # Each matrix leg now runs on a *native* runner for its own platform -
    # no QEMU. The backend pulls in pythonocc-core (OCCT, a large native
    # C++ geometry kernel) and py-slvs (a native constraint solver); running
    # that under QEMU's user-mode binary translation on the arm64 leg was
    # not just slow but prone to genuinely stalling for 40+ minutes on a
    # step the native amd64 leg finished in ~2 - a known bad combination for
    # emulating heavy native/floating-point code, not something tunable
    # away with more parallelism or caching. GitHub's arm64-hosted runners
    # (ubuntu-24.04-arm) are free for public repos and remove the emulation
    # layer entirely, so this leg now builds and runs on real arm64
    # hardware, same as the amd64 leg already did on real amd64 hardware.
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        # `suite` splits the tests into three parallel legs per platform:
        #   core        everything that is not a gear test (`-m "not gears"`)
        #   gears       gear / bevel / rack / planetary tests except the bevel pair
        #               modules (`-m "gears and not bevel_pair"`, plus the serial
        #               planetary job tests)
        #   bevel_pair  the bevel pair modules (`-m bevel_pair`): meshing-phase
        #               searches, some 100-280 s each, the slowest tests by far
        # Markers are set by file name in tests/conftest.py. Wall-clock is the
        # slowest leg instead of the sum, and a failure in one group no longer
        # hides behind (or waits for) the others. Every test is in exactly one leg.
        platform: [linux/amd64, linux/arm64]
        suite: [core, gears, bevel_pair]
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: ${{ matrix.platform }}
          tags: didsa-cad-backend:test
          load: true
          # Six legs build the same two images; share layers between them
          # (and between runs) so the OCCT/conda layers are not rebuilt each time.
          cache-from: type=gha,scope=backend-${{ matrix.platform }}
          cache-to: type=gha,scope=backend-${{ matrix.platform }},mode=max

      # Speed: `--dist=worksteal` (vs. the previous default `load`) cut local
      # wall-clock 24:11 -> 15:48 for the same 2049 tests, measured directly
      # (not assumed) - this suite's duration is dominated by a handful of
      # genuinely expensive real-geometry tests (spiral bevel pair meshing-
      # phase searches, some 200s+ each - see `test_bevel_pair_feature.py`),
      # and `load`'s eager one-at-a-time dispatch left the tail badly
      # imbalanced when a worker got unlucky and picked up several of them
      # back to back while other workers sat idle; `worksteal` actively
      # rebalances a worker's remaining queue instead of only reassigning
      # once a worker goes completely empty. Pure scheduler change, zero
      # effect on which tests run or what they assert.
      #
      # Correctness: `test_planetary_gear_jobs.py`'s own job-concurrency-
      # singleton tests (real `ProcessPoolExecutor` worker-count/cancel-
      # timing assertions) are flaky under any parallel xdist run - confirmed
      # by a real CI failure-then-pass-on-retry with an identical commit, and
      # by this exact file passing 8/8 cleanly every time it's run serially,
      # both this session. Split out into its own serial invocation so CI
      # stops reporting spurious failures for unrelated PRs - costs ~20s,
      # not worth trading away for parallelism on a file only 8 tests long.
      - name: Run backend tests inside container (${{ matrix.suite }})
        run: |
          case "${{ matrix.suite }}" in
            gears)
              # The planetary job-concurrency tests are serial-only (see above).
              CMD='python -m pytest tests/ -v -m "gears and not bevel_pair" -n auto --dist=worksteal --ignore=tests/test_planetary_gear_jobs.py && python -m pytest tests/test_planetary_gear_jobs.py -v' ;;
            bevel_pair)
              CMD='python -m pytest tests/ -v -m bevel_pair -n auto --dist=worksteal' ;;
            *)
              CMD='python -m pytest tests/ -v -m "not gears" -n auto --dist=worksteal' ;;
          esac
          docker run --rm --platform ${{ matrix.platform }} \
            didsa-cad-backend:test \
            bash -c "$CMD"

name: Client - build and test

on:
  push:
    branches:
      - "**"
    paths:
      - "client/**"
      - ".github/workflows/client-verify.yml"
  pull_request:
    paths:
      - "client/**"
  # Manual trigger for any branch, even one with no client/** changes of its
  # own (e.g. a backend-only branch where someone just wants a debug APK
  # built and published as this branch's own Release asset).
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      # This project's `.metadata`/pubspec.lock track a `master`-channel
      # Flutter revision, not stable - see docs/status.md's "Flutter CI
      # workflow" entries for why: flutter_scene 0.18.1 depends directly on
      # flutter_gpu's still-experimental, evolving API surface, and the
      # specific shape it needs isn't present in current stable Flutter
      # (confirmed by a real CI failure against stable 3.44.5 - VertexLayout/
      # VertexFormat/VertexAttribute/TextureCompressionFamily and others were
      # missing entirely). `channel: master` matches what this project is
      # actually developed and run against - not a recommendation for CI in
      # general (master is Flutter's most volatile channel and can break for
      # reasons unrelated to this repo), but the only channel that currently
      # reflects reality here.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        if: ${{ !cancelled() }}
        run: flutter test

      # Debug-signed only (no release keystore configured) - good enough for
      # sideloading onto a test device, not a Play Store-ready build. No
      # externalNativeBuild is wired up for client/native/slvs (see its own
      # CMakeLists.txt header - that's still a separate, partly-manual cross
      # -compile step), so this APK doesn't bundle the local FFI sketch
      # solver; the app's own documented network fallback covers that gap,
      # not a build failure here. Runs only after analyze+test both pass
      # (default `if: success()`, unlike the `!cancelled()` steps above).
      - name: Build debug APK
        run: flutter build apk --debug

      # Published as a GitHub Release asset rather than committed into the
      # tracked tree: git can't delta-compress a binary against its prior
      # version, so committing a new APK on every push (this workflow
      # triggers on every branch touching client/**) would grow the repo's
      # object store by one full APK's size per push, forever - a Release
      # asset lives in GitHub's separate storage instead, so the repo itself
      # never grows.
      #
      # One release *per branch* (tag client-debug-<branch, slashes as
      # dashes>), not one shared "latest" - several branches can be under
      # test at once, and a single shared tag would mean whichever branch
      # pushed most recently silently clobbers every other branch's APK.
      # `gh release upload --clobber` replaces that branch's own asset in
      # place on a later push to the same branch; `gh release create` only
      # the first time. The asset filename itself also carries the branch
      # name, so the downloaded file is identifiable on-device, not just on
      # the GitHub Releases page. Known limitation, not handled here: a
      # release isn't cleaned up when its branch is later deleted/merged -
      # stale per-branch releases accumulate until manually removed.
      #
      # Only runs for a real push or a manual workflow_dispatch (not a
      # pull_request build, which may come from a fork without
      # release-creation access here).
      - name: Publish debug APK as a GitHub Release asset
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          BRANCH="${{ github.ref_name }}"
          SLUG=$(echo "$BRANCH" | tr '/' '-')
          TAG="client-debug-$SLUG"
          ASSET_NAME="DIDSA-CAD-client-$SLUG.apk"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NOTES="Debug-signed sideload build for branch \`$BRANCH\` at commit \`$SHORT_SHA\`. Auto-published by CI - not a Play Store-ready release."
          cp client/build/app/outputs/flutter-apk/app-debug.apk "$ASSET_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET_NAME" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$ASSET_NAME" --title "Client debug build - $BRANCH" --notes "$NOTES"
          fi

      # STEP support (client/lib/mesh_viewer/step_loader.dart, client/native/
      # occt/) needs a real OCCT build to actually link against - not
      # attempted in the main analyze-and-test job above (which doesn't
      # build the didsa_occt_ffi native shim at all, same as it never has
      # for client/native/slvs/ either). Linux is a headless CI-
      # verification target only for this app (see client/native/occt/
      # CMakeLists.txt's own header comment), so this step just confirms
      # `flutter build linux` still succeeds with DIDSA_ENABLE_OCCT turned
      # on and a real vcpkg-built opencascade port available - it never
      # ships anywhere.
      #
      # vcpkg's own `opencascade` port is a large, slow build (the
      # underlying OCCT source tree itself, not a prebuilt binary) - a real
      # CI run took ~1.7h just to build it, every single time, because
      # nothing was caching the compiled result across runs. Fixed below by
      # exporting vcpkg's own GitHub Actions binary-caching backend
      # (`x-gha`) - vcpkg checks the cache for an already-built
      # `opencascade` package (keyed by its own content hash, which
      # vcpkg.json's pinned "overrides" version keeps stable) before
      # rebuilding, so only the *first* run after this change (or after the
      # pinned version changes) pays the ~1.7h cost; later runs restore the
      # prebuilt package in seconds. `actions/github-script` is the
      # documented way to surface the two env vars vcpkg's GHA backend
      # needs (`ACTIONS_CACHE_URL`/`ACTIONS_RUNTIME_TOKEN`) - they exist in
      # every Actions run but aren't in `env` by default.
      #
      # `flutter build linux -- -DFOO=BAR` does NOT forward trailing args to
      # the underlying cmake configure - confirmed by a real CI failure
      # ("Target file \"-DDIDSA_ENABLE_OCCT=ON\" not found.") on the Windows
      # job, which hits the same flutter-tool code path. client/linux/
      # CMakeLists.txt instead reads DIDSA_ENABLE_OCCT/CMAKE_TOOLCHAIN_FILE/
      # VCPKG_TARGET_TRIPLET from the environment (set before project(), so
      # vcpkg's toolchain actually takes effect) - so this step exports them
      # as env vars rather than passing `-- -D...` args.
      - name: Export vcpkg GitHub Actions binary cache variables
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # find_package(OpenCASCADE CONFIG REQUIRED) lives in client/native/
      # occt/CMakeLists.txt, a subdirectory of this configure (added via
      # add_subdirectory from client/linux/CMakeLists.txt), not this job's
      # own CMAKE_SOURCE_DIR - so vcpkg's manifest-mode auto-install (which
      # only looks for vcpkg.json at CMAKE_SOURCE_DIR by default) would
      # never see client/native/occt/vcpkg.json's pinned version at all.
      # client/linux/CMakeLists.txt now sets VCPKG_MANIFEST_DIR to point
      # manifest mode at that subdirectory explicitly (see its own comment)
      # - confirmed necessary by a real CI failure ("Could not find a
      # package configuration file provided by \"OpenCASCADE\"") before
      # this was added; this step no longer needs its own explicit
      # `vcpkg install` at all, matching the Windows job below.
      - name: Build Linux (with STEP/OCCT support)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DIDSA_ENABLE_OCCT: "1"
          VCPKG_TARGET_TRIPLET: x64-linux
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
          [ -d "$VCPKG_ROOT" ] || git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          export CMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          flutter build linux --release

      # arm64-android triplet support for vcpkg's own "opencascade" port is
      # unverified (see client/native/occt/CMakeLists.txt's own header
      # comment, and client/android/app/build.gradle's own doc comment on
      # why this hook is off by default) - continue-on-error so a failure
      # here (expected, until that triplet is actually proven out) never
      # blocks the real debug-APK build/publish steps above, mirroring the
      # honesty of this same file's own long-standing gap for
      # client/native/slvs/ (see this job's "Build debug APK" step comment).
      #
      # Shares the same $VCPKG_ROOT checkout the Linux step above already
      # cloned (same job, same workspace) rather than cloning a second time
      # into the same path - confirmed necessary by a real CI failure
      # ("destination path ... already exists and is not empty directory")
      # before the `[ -d ... ] ||` guard was added to both steps.
      - name: Build Android STEP/OCCT native shim (allowed to fail)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          DIDSA_ENABLE_OCCT: "1"
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          [ -d "$VCPKG_ROOT" ] || git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          flutter build apk --debug

  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Windows is vcpkg's most mature target for the "opencascade" port
      # (see client/native/occt/CMakeLists.txt's own header comment) -
      # proven out first, ahead of the Android/iOS triplets. `vcpkg` ships
      # preinstalled on GitHub's windows-latest runner image.
      #
      # `flutter build windows -- -DFOO=BAR` does NOT forward trailing args
      # to the underlying cmake configure - flutter's own arg parser treats
      # them as target-file arguments instead. Confirmed by a real CI
      # failure here: vcpkg successfully built opencascade (took ~1.7h),
      # then the build failed with "Target file \"-DDIDSA_ENABLE_OCCT=ON\"
      # not found." client/windows/CMakeLists.txt instead reads
      # DIDSA_ENABLE_OCCT/CMAKE_TOOLCHAIN_FILE/VCPKG_TARGET_TRIPLET from the
      # environment (set before project(), so vcpkg's toolchain actually
      # takes effect) - so this step exports them as env vars instead.
      #
      # Also confirmed by a real CI failure: without binary caching, this
      # step rebuilds opencascade from source (~1.7h) on every single run,
      # even though vcpkg.json pins an exact version that never changes
      # between runs. `x-gha` is vcpkg's built-in GitHub Actions
      # binary-cache backend - after the first successful build, later runs
      # restore the prebuilt package instead of recompiling OCCT.
      #
      # This step used to run a standalone `vcpkg install opencascade
      # --triplet x64-windows` before building - that's vcpkg's *classic*
      # mode (an explicit port name on the command line), which completely
      # ignores client/native/occt/vcpkg.json's pinned "overrides" and
      # installs whatever opencascade's current default baseline happens to
      # be. Confirmed by a real CI failure: it silently reinstalled 8.0.1
      # again despite the pin, reproducing the exact TKSTEP.lib link
      # failure the pin exists to avoid. Removed - client/windows/
      # CMakeLists.txt's VCPKG_MANIFEST_DIR now points manifest mode at
      # that vcpkg.json directly, so `flutter build windows`'s own cmake
      # configure installs the pinned version automatically, the same way
      # the Linux job's configure now does.
      - name: Export vcpkg GitHub Actions binary cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Build Windows (with STEP/OCCT support)
        env:
          DIDSA_ENABLE_OCCT: "1"
          VCPKG_TARGET_TRIPLET: x64-windows
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          $env:CMAKE_TOOLCHAIN_FILE = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          flutter build windows --release


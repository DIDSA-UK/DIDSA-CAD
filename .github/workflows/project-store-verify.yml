name: Project store - test

on:
  push:
    branches:
      - "**"
    paths:
      - "project-store/**"
      - ".github/workflows/project-store-verify.yml"
  pull_request:
    paths:
      - "project-store/**"

jobs:
  test:
    # The store is Python + FastAPI + SQLite with no native dependencies, so it runs on a plain runner (no Docker build is needed for
    # the tests; the image is Python 3.11 like this job).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: project-store/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run the project store's tests
        run: python -m pytest tests/ -v
